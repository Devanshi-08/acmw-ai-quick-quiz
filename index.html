<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A short ACM-W and Artificial Intelligence quiz." />
    <title>ACM-W | Quiz Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="quiz-card" aria-labelledby="quiz-title">
        <header class="quiz-header">
          <a class="brand" href="." aria-label="Restart the ACM-W quiz">
            <span class="brand-mark">A</span>
            <span>ACM-W</span>
          </a>
          <span class="challenge-label">Quiz Challenge <span aria-hidden="true">✦</span></span>
        </header>

        <div class="intro-row">
          <div>
            <p class="eyebrow">Learn. Think. Lead.</p>
            <h1 id="quiz-title">ACM-W &amp; AI<br />Quick Quiz</h1>
          </div>
          <p class="quiz-description">A ten-question sprint through computing community and AI essentials.</p>
        </div>

        <div class="progress-section" aria-label="Quiz progress">
          <div class="progress-copy"><span id="question-counter">Question 1 of 10</span><span id="answered-counter">0 answered</span></div>
          <div class="progress-track"><span id="progress-bar"></span></div>
        </div>

        <form id="quiz-form" novalidate>
          <fieldset id="question-container" class="question-panel"></fieldset>
          <p id="validation-message" class="validation-message" role="alert" aria-live="polite"></p>
          <div class="actions">
            <button id="previous-button" class="button button-secondary" type="button">← Back</button>
            <button id="next-button" class="button button-primary" type="button">Next question <span aria-hidden="true">→</span></button>
          </div>
        </form>

        <section id="results" class="results" hidden aria-live="polite">
          <p class="eyebrow">Quiz complete</p>
          <h2 id="result-heading">Great work!</h2>
          <div class="score-orbit"><span id="score-value">0/10</span><small>score</small></div>
          <p id="result-message"></p>
          <div id="answer-review" class="answer-review"></div>
          <button id="restart-button" class="button button-primary" type="button">Try again <span aria-hidden="true">↻</span></button>
        </section>
      </section>
      <p class="footer-note">Built for curious minds in computing.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
